[project]
name = "mmic-project"
version = "0.1.0"
description = "Genesis simulation and sim-to-real robotics experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "quadrants==1.3.3",
    "genesis-world>=1.4.4,<1.5",
    "setuptools<80.0.0",
    "torchrl==0.14.0",
    "tensorboard>=2.20,<3",
]

[project.optional-dependencies]
cuda = [
    "torch",
    "triton; sys_platform == 'linux'",
    "onnxruntime-gpu",
    "gs-nyx-plugin==0.1.10",
    "gs-nyx==0.1.8",
]
rocm = ["torch", "triton", "onnxruntime-migraphx"]
metal = ["torch", "onnxruntime"]

[project.scripts]
mmic-smoke = "mmic_project.smoke:main"
mmic-nyx-smoke = "mmic_project.nyx_smoke:main"

[build-system]
requires = ["setuptools>=77,<80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
conflicts = [
    [{ extra = "cuda" }, { extra = "rocm" }],
    [{ extra = "cuda" }, { extra = "metal" }],
    [{ extra = "rocm" }, { extra = "metal" }],
]

# Genesis is resolved from PyPI; no local fork or Git submodule is required.
[tool.uv.sources]
torch = [
    { index = "rocm724", extra = "rocm" },
    { index = "cuda130", extra = "cuda" },
    { index = "pypi", extra = "metal" },
]
triton = [
    { index = "rocm724", extra = "rocm" },
    { index = "cuda130", extra = "cuda" },
]

[[tool.uv.index]]
name = "cuda130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "rocm724"
url = "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.4/"
format = "flat"
explicit = true
